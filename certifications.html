<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f7">
  <title>資格 | 香川高専 EC 単位管理</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/certifications.css">
  <script type="module" src="./js/certifications.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container subpage" id="main-content">
    <header class="page-intro">
      <h1>資格</h1>
    </header>

    <section class="panel cert-overview" aria-labelledby="cert-total-title">
      <h2 id="cert-total-title">資格の取得単位</h2>
      <dl class="cert-totals" aria-live="polite">
        <div><dt>合計</dt><dd><strong id="cert-total">0</strong> 単位</dd></div>
        <div><dt>一般</dt><dd><strong id="cert-general">0</strong> 単位</dd></div>
        <div><dt>専門</dt><dd><strong id="cert-specialized">0</strong> 単位</dd></div>
      </dl>
    </section>

    <section class="cert-section" id="external-credits" aria-labelledby="external-title">
      <div class="cert-section-heading">
        <div class="cert-external-summary">
          <h2 id="external-title">その他の認定単位</h2>
          <span class="cert-count" aria-live="polite"><strong id="external-total">0</strong> 単位</span>
        </div>
        <button type="button" class="button secondary" id="external-add" aria-controls="external-editor" aria-expanded="false">＋ その他を追加</button>
      </div>
      <form class="panel cert-external-editor" id="external-editor" aria-labelledby="external-title" hidden>
        <div class="cert-external-fields">
          <label class="field" for="external-name">
            <span>科目名</span>
            <input id="external-name" type="text" name="name" required autocomplete="off">
          </label>
          <label class="field" for="external-category">
            <span>区分</span>
            <select id="external-category" name="category" required>
              <option value="" disabled selected>選択</option>
              <option value="general">一般</option>
              <option value="specialized">専門</option>
            </select>
          </label>
          <label class="field" for="external-credits-input">
            <span>認定単位数</span>
            <input type="number" id="external-credits-input" name="credits" min="1" step="1" inputmode="numeric" required>
          </label>
        </div>
        <p class="cert-external-message" id="external-message" role="alert" hidden></p>
        <div class="cert-external-editor-actions">
          <button type="submit" class="button">保存</button>
          <button type="button" class="button secondary" id="external-cancel">キャンセル</button>
          <button type="button" class="quiet-button cert-external-delete" id="external-delete" hidden>削除</button>
        </div>
      </form>
      <ul id="external-list" class="panel subject-list cert-external-list" hidden></ul>
    </section>

    <section class="cert-section" aria-labelledby="cert-list-title">
      <div class="cert-section-heading">
        <h2 id="cert-list-title">資格・検定一覧</h2>
      </div>
      <div id="cert-list" class="cert-list"></div>
    </section>
    <noscript><p class="note">資格を管理するには、ブラウザでJavaScriptを有効にしてください。</p></noscript>
  </main>
  <div id="site-footer"></div>
</body>
</html>
