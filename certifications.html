<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f7">
  <title>資格認定 | 香川高専 EC 単位管理</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/certifications.css">
  <script type="module" src="./js/certifications.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container subpage" id="main-content">
    <header class="page-intro cert-intro">
      <div>
        <h1>資格認定</h1>
        <p class="intro-description">学校認定済みの資格だけが集計に反映されます。</p>
      </div>
      <a class="button secondary" href="#external-credits">その他の認定単位</a>
    </header>

    <section class="panel cert-overview" aria-labelledby="cert-total-title">
      <h2 id="cert-total-title">資格認定の取得単位</h2>
      <dl class="cert-totals" aria-live="polite">
        <div><dt>合計</dt><dd><strong id="cert-total">0</strong> 単位</dd></div>
        <div><dt>一般</dt><dd><strong id="cert-general">0</strong> 単位</dd></div>
        <div><dt>専門</dt><dd><strong id="cert-specialized">0</strong> 単位</dd></div>
      </dl>
    </section>

    <section class="cert-section" aria-labelledby="cert-list-title">
      <div class="cert-section-heading">
        <h2 id="cert-list-title">資格・検定一覧</h2>
        <a class="text-link" href="https://www.kagawa-nct.ac.jp/general_affairs/rules/05-04.pdf" target="_blank" rel="noopener noreferrer">認定規程（PDF）</a>
      </div>
      <p class="muted">同じグループでは、学校認定済みのうち最も多い単位数を計上します。</p>
      <div class="filter-bar panel cert-filters" role="group" aria-label="資格・検定の絞り込み">
        <label class="field" for="cert-search">
          <span>資格名・級・点数で検索</span>
          <span class="cert-search-input">
            <span data-icon="search"></span>
            <input type="search" id="cert-search" placeholder="例：TOEIC、英検、2級" autocomplete="off">
          </span>
        </label>
        <label class="field" for="cert-category">
          <span>一般／専門</span>
          <select id="cert-category">
            <option value="">すべて</option>
            <option value="general">一般</option>
            <option value="specialized">専門</option>
          </select>
        </label>
      </div>
      <div id="cert-list" class="cert-list"></div>
    </section>

    <section class="cert-section" id="external-credits" aria-labelledby="external-title">
      <div class="cert-section-heading">
        <h2 id="external-title">その他の認定単位</h2>
        <span class="cert-count"><strong id="external-total" aria-live="polite">0</strong> 単位</span>
      </div>
      <p class="muted">学校が認定し、判定に算入される学外単位を重複なく入力してください。他高専の「自由科目」は進級・卒業の判定対象外です。</p>
      <div id="external-list" class="cert-list"></div>
    </section>
    <noscript><p class="note">資格認定を管理するには、ブラウザでJavaScriptを有効にしてください。</p></noscript>
  </main>
  <div id="site-footer"></div>
</body>
</html>
